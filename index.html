<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>متجر 『𝓑𝓻𝓪𝓲𝓷𝓼𝓽𝓸𝓻𝓶』</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#06060c;
    --deep:#0c0d1a;
    --panel:#12122200;
    --glass: rgba(255,255,255,0.045);
    --glass-strong: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.09);
    --border-soft: rgba(255,255,255,0.05);
    --violet:#8b5cf6;
    --violet-soft:#a78bfa;
    --cyan:#38d0f8;
    --violet-glow: rgba(139,92,246,0.45);
    --cyan-glow: rgba(56,208,248,0.32);
    --text:#e9e7f7;
    --text-dim:#6b7280;
    --text-faint:#8a8598;
    --gold:#f7c948;
    --silver:#cfd3e6;
    --bronze:#c98a4b;
    --danger:#f76e6e;
    --success:#4ce0a8;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 10px;
    --font-head:'Cairo', 'Tajawal', sans-serif;
    --font-body:'Tajawal', 'Cairo', sans-serif;
    /* bright theme */
    --grad-purple:#7b3fe4;
    --grad-blue:#2f6bff;
    --ink:#241a3d;
    --price-a:#ff9d4d;
    --price-b:#ff6a3d;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family: var(--font-body);
    background: linear-gradient(165deg, var(--grad-purple) 0%, #5a4ff0 42%, var(--grad-blue) 100%);
    color: var(--text);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Ambient background ---------- */
  .bg-scene{ display:none; }
  .bg-scene::before, .bg-scene::after{
    content:''; position:absolute; border-radius:50%;
    filter: blur(90px); opacity:.55;
  }
  .bg-scene::before{
    width:420px; height:420px; background: var(--violet-glow);
    top:-140px; right:-120px;
    animation: drift1 22s ease-in-out infinite alternate;
  }
  .bg-scene::after{
    width:380px; height:380px; background: var(--cyan-glow);
    bottom:-140px; left:-100px;
    animation: drift2 26s ease-in-out infinite alternate;
  }
  @keyframes drift1{ from{transform:translate(0,0);} to{transform:translate(-40px,60px);} }
  @keyframes drift2{ from{transform:translate(0,0);} to{transform:translate(50px,-40px);} }

  .grain{ display:none; }

  /* ---------- utility ---------- */
  .glass{
    background: #ffffff;
    border: none;
    box-shadow: 0 14px 36px -16px rgba(20,8,70,0.35);
    color: var(--ink);
  }
  .hidden{ display:none !important; }
  ::selection{ background: var(--violet); color:#fff; }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-thumb{ background: rgba(139,92,246,0.4); border-radius:10px; }

  a, button{ font-family:inherit; color:inherit; }
  button{ cursor:pointer; border:none; background:none; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 26px; border-radius:100px; font-size:15px; font-weight:700;
    font-family:var(--font-head);
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .3s, filter .25s;
  }
  .btn-primary{
    color:#0a0714;
    background: linear-gradient(135deg, var(--violet-soft), var(--cyan) 130%);
    box-shadow: 0 8px 30px -8px var(--violet-glow);
  }
  .btn-primary:active{ transform: scale(.96); }
  .btn-primary:hover{ filter:brightness(1.08); box-shadow:0 10px 36px -6px var(--violet-glow); }

  .btn-ghost{
    color: var(--text);
    background: var(--glass);
    border:1px solid var(--border);
  }
  .btn-ghost:hover{ background: var(--glass-strong); border-color: rgba(139,92,246,0.5); }
  .btn-ghost:active{ transform:scale(.96); }

  .btn-danger-outline{
    color: var(--danger); background: rgba(247,110,110,0.08); border:1px solid rgba(247,110,110,0.3);
  }
  .btn-danger-outline:hover{ background: rgba(247,110,110,0.15); }

  /* =====================================================
     LOGIN SCREEN
  ===================================================== */
  #loginScreen{
    position:relative; z-index:2; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:32px 18px;
  }
  .login-card{
    width:100%; max-width:420px;
    border-radius: var(--radius-lg);
    padding:38px 30px 32px;
    position:relative;
    animation: rise .7s cubic-bezier(.16,1,.3,1);
    box-shadow: 0 30px 80px -30px rgba(0,0,0,.7);
  }
  .login-card::before{
    content:''; position:absolute; inset:-1px; border-radius:inherit; padding:1px;
    background: linear-gradient(140deg, rgba(139,92,246,.55), rgba(56,208,248,.15) 40%, transparent 70%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events:none;
  }
  @keyframes rise{ from{ opacity:0; transform:translateY(24px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }

  .login-emblem{
    width:78px; height:78px; margin:0 auto 18px; border-radius:26px;
    display:flex; align-items:center; justify-content:center; font-size:34px;
    background: linear-gradient(145deg, rgba(139,92,246,.35), rgba(56,208,248,.18));
    border:1px solid var(--border);
    box-shadow: 0 0 40px -6px var(--violet-glow), inset 0 0 20px rgba(255,255,255,.04);
  }
  .login-group-name{
    text-align:center; font-family:var(--font-head); font-weight:800; font-size:19px;
    letter-spacing:.5px; margin-bottom:4px;
    background: linear-gradient(90deg, var(--ink), var(--violet-soft) 55%, var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    line-height:1.6;
  }
  .login-title{
    text-align:center; font-family:var(--font-head); font-weight:900; font-size:27px;
    margin:14px 0 6px; color:var(--ink);
  }
  .login-sub{ text-align:center; color:var(--text-dim); font-size:14px; margin-bottom:28px; line-height:1.7; }

  .field-label{ font-size:13px; color:var(--text-dim); margin-bottom:9px; display:block; font-weight:500; }

  .select-wrap{ position:relative; margin-bottom:10px; }
  .member-select{
    width:100%; appearance:none; -webkit-appearance:none;
    background: #f4f2fb;
    border:1.5px solid #e7e2f5;
    color: var(--ink);
    padding:15px 46px 15px 18px;
    border-radius: var(--radius-md);
    font-size:15.5px; font-family:var(--font-body); font-weight:500;
    transition: border-color .25s, background .25s;
  }
  .member-select:focus{ outline:none; border-color: var(--violet-soft); background: rgba(139,92,246,0.06); }
  .select-wrap::after{
    content:'⌄'; position:absolute; right:18px; top:50%; transform:translateY(-55%);
    font-size:20px; color: var(--violet); pointer-events:none;
  }
  .member-select option{ background:#fff; color:var(--ink); }

  .login-error{
    max-height:0; overflow:hidden; opacity:0;
    transition: max-height .35s ease, opacity .3s ease, margin .3s ease;
    color: var(--danger); background: rgba(247,110,110,0.1);
    border:1px solid rgba(247,110,110,0.3);
    border-radius: var(--radius-sm); font-size:13.5px; text-align:center;
  }
  .login-error.show{ max-height:60px; opacity:1; margin:14px 0 0; padding:11px; }

  #loginBtn{ width:100%; margin-top:20px; padding:16px; font-size:16px; }

  /* =====================================================
     APP SHELL
  ===================================================== */
  #app{ position:relative; z-index:2; display:none; min-height:100vh; flex-direction:column; }
  #app.active{ display:flex; }

  .topbar{
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:14px 18px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom:1px solid rgba(255,255,255,0.16);
  }
  .brand{ display:flex; align-items:center; gap:11px; min-width:0; }
  .brand-mark{
    width:38px; height:38px; border-radius:12px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:18px;
    background: linear-gradient(145deg, rgba(139,92,246,.4), rgba(56,208,248,.2));
    border:1px solid var(--border);
  }
  .brand-text{ min-width:0; }
  .brand-text .g-name{
    font-family:var(--font-head); font-weight:800; font-size:13.5px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:44vw;
    background: linear-gradient(90deg,#fff, var(--violet-soft));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand-text .g-sub{ font-size:11px; color: rgba(255,255,255,0.82); }

  .topbar-right{ display:flex; align-items:center; gap:10px; }

  .icon-btn{
    width:40px; height:40px; border-radius:50%; position:relative;
    display:flex; align-items:center; justify-content:center; font-size:17px;
    background: var(--glass); border:1px solid var(--border);
    transition: background .2s, transform .2s;
  }
  .icon-btn:hover{ background: var(--glass-strong); }
  .icon-btn:active{ transform:scale(.92); }
  .badge-dot{
    position:absolute; top:6px; left:7px; width:8px; height:8px; border-radius:50%;
    background: var(--cyan); box-shadow:0 0 8px var(--cyan);
  }

  .avatar{
    width:38px; height:38px; border-radius:50%; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-head); font-weight:800; font-size:15px; color:#0a0714;
    background: linear-gradient(140deg, var(--violet-soft), var(--cyan));
    box-shadow:0 0 0 2px rgba(255,255,255,.06);
  }

  .notif-panel{
    position:absolute; top:60px; left:14px; width:290px; max-width:80vw;
    border-radius: var(--radius-md); padding:8px; z-index:50;
    background: rgba(14,14,26,0.95);
    box-shadow:0 20px 50px -18px rgba(0,0,0,.7);
    opacity:0; transform: translateY(-8px); pointer-events:none;
    transition: opacity .22s, transform .22s;
  }
  .notif-panel.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .notif-head{ font-size:12.5px; color:var(--text-dim); padding:10px 12px 6px; font-weight:700; }
  .notif-item{ padding:11px 12px; border-radius:10px; font-size:13px; line-height:1.6; }
  .notif-item:hover{ background: rgba(255,255,255,0.04); }
  .notif-empty{ padding:20px 12px; text-align:center; color:var(--text-faint); font-size:13px; }

  /* ---------- desktop nav ---------- */
  .desknav{
    display:none; gap:4px; padding:0 18px 14px;
  }
  .desknav button{
    padding:9px 15px; border-radius:100px; font-size:13.5px; font-weight:700;
    color:var(--text-dim); display:flex; align-items:center; gap:7px;
    transition: color .2s, background .2s;
  }
  .desknav button.active{ color:#fff; background: var(--glass-strong); }
  .desknav button:hover{ color:#fff; }

  main{ flex:1; padding: 20px 18px 100px; max-width:920px; width:100%; margin:0 auto; }

  .section{ animation: fadein .45s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  .page-title{ font-family:var(--font-head); font-weight:800; font-size:22px; margin-bottom:4px; }
  .page-sub{ color:var(--text-dim); font-size:13.5px; margin-bottom:22px; }

  /* ---------- home ---------- */
  .welcome{ font-family:var(--font-head); font-weight:800; font-size:24px; margin-bottom:20px; }

  .balance-card{
    border-radius: var(--radius-lg); padding:26px 24px; position:relative; overflow:hidden;
    background: linear-gradient(135deg, rgba(139,92,246,0.22), rgba(56,208,248,0.09));
    border:1px solid rgba(139,92,246,0.25);
    margin-bottom:18px;
    animation: balanceGlow 4.5s ease-in-out infinite;
  }
  @keyframes balanceGlow{
    0%,100%{ box-shadow: 0 0 0 rgba(139,92,246,0); }
    50%{ box-shadow: 0 0 34px -6px rgba(139,92,246,0.35); }
  }
  .balance-card::after{
    content:''; position:absolute; width:220px; height:220px; border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,.12), transparent 70%);
    top:-90px; left:-70px;
  }
  .balance-label{ font-size:13.5px; color: rgba(233,231,247,0.75); margin-bottom:10px; position:relative; }
  .balance-value{ font-family:var(--font-head); font-weight:900; font-size:44px; display:flex; align-items:baseline; gap:8px; position:relative; }
  .balance-value span.unit{ font-size:15px; font-weight:600; color: rgba(233,231,247,0.7); }
  .balance-rank{ margin-top:12px; font-size:13px; color: rgba(233,231,247,0.75); position:relative; }

  .stat-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:12px; margin-bottom:26px; }
  .stat-card{
    border-radius: var(--radius-md); padding:16px; text-align:center;
    transition: transform .25s, border-color .25s;
  }
  .stat-card:active{ transform: scale(.96); }
  .stat-icon{ font-size:20px; margin-bottom:8px; }
  .stat-num{ font-family:var(--font-head); font-weight:800; font-size:20px; }
  .stat-lbl{ font-size:11.5px; color:var(--text-dim); margin-top:3px; }

  .section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .section-head h3{ font-family:var(--font-head); font-size:16px; font-weight:800; display:flex; align-items:center; gap:8px; }

  /* ---------- product cards ---------- */
  .product-grid{ display:grid; grid-template-columns: 1fr; gap:14px; }
  .product-card{
    border-radius: var(--radius-md); padding:18px 16px; position:relative;
    display:flex; flex-direction:column; gap:10px;
    transition: transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s;
  }
  .product-card:hover{ transform: translateY(-3px); box-shadow:0 20px 44px -16px rgba(91,45,225,0.35); }
  .product-card:active{ transform: translateY(-1px) scale(.98); }

  .p-top-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .p-name{ font-weight:800; font-size:16px; line-height:1.5; flex:1; }
  .price-badge{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:4px;
    background: linear-gradient(135deg, var(--price-a), var(--price-b));
    color:#fff; font-family:var(--font-head); font-weight:800; font-size:13px;
    padding:7px 13px; border-radius:100px; white-space:nowrap;
    box-shadow: 0 8px 16px -6px rgba(255,106,61,0.55);
  }
  .price-badge .star{ font-size:12px; }

  .p-desc{ font-size:13px; color:var(--text-dim); line-height:1.7; }

  .p-badge{
    display:inline-block; font-size:10px; font-weight:800; padding:3px 9px; border-radius:100px;
    font-family:var(--font-head); vertical-align:middle;
  }
  .badge-new{ background: rgba(76,224,168,0.14); color: #1e9c72; border:1px solid rgba(76,224,168,0.4); }
  .badge-hot{ background: rgba(247,110,110,0.14); color:#e5484d; border:1px solid rgba(247,110,110,0.4); }
  .badge-top{ background: rgba(247,201,72,0.16); color: #c9930f; border:1px solid rgba(247,201,72,0.45); }

  .redeem-btn{
    width:100%; padding:14px; border-radius:14px; font-size:14.5px; font-weight:800;
    font-family:var(--font-head);
    background: linear-gradient(135deg, var(--grad-purple), var(--grad-blue));
    color:#fff; border:none;
    box-shadow: 0 10px 24px -10px rgba(60,60,220,0.5);
    transition: transform .2s, box-shadow .2s;
  }
  .redeem-btn:hover{ transform: translateY(-2px); box-shadow: 0 14px 30px -10px rgba(60,60,220,0.6); }

  .product-card.locked{ opacity:.58; }
  .product-card.locked:hover{ transform:none; box-shadow:none; }
  .locked-btn{ background: #edeaf5; color: var(--text-faint); cursor:not-allowed; box-shadow:none; }
  .locked-btn:hover{ transform:none; background: #edeaf5; color: var(--text-faint); box-shadow:none; }

  /* ---------- search + categories (store) ---------- */
  .search-bar{
    display:flex; align-items:center; gap:10px; padding:13px 16px; border-radius:100px;
    margin-bottom:16px;
  }
  .search-bar input{
    flex:1; background:none; border:none; color:var(--text); font-size:14.5px; font-family:inherit;
  }
  .search-bar input:focus{ outline:none; }
  .search-bar input::placeholder{ color: var(--text-faint); }

  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:14px; margin-bottom:6px; scrollbar-width:none; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; padding:9px 16px; border-radius:100px; font-size:12.5px; font-weight:700;
    background: var(--glass); border:1px solid var(--border); color: var(--text-dim);
    transition: all .2s;
  }
  .chip.active{ background: linear-gradient(120deg, var(--violet), var(--cyan)); color:#0a0714; border-color:transparent; }

  /* ---------- leaderboard ---------- */
  .podium{ display:flex; align-items:flex-end; gap:10px; margin-bottom:22px; }
  .podium-slot{
    flex:1; border-radius: var(--radius-md) var(--radius-md) 0 0; padding:16px 8px 14px; text-align:center; position:relative;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .podium-slot.p1{ padding-top:26px; }
  .podium-crown{ font-size:28px; animation: floatCrown 3.2s ease-in-out infinite; }
  @keyframes floatCrown{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-5px); } }
  .podium-slot .p-medal{ font-size:22px; }
  .podium-slot .p-name{ font-weight:800; font-size:13px; }
  .podium-slot .p-pts{ font-family:var(--font-head); font-weight:900; font-size:16px; }
  .podium-1{ background: linear-gradient(180deg, rgba(247,201,72,0.22), rgba(247,201,72,0.03)); border:1px solid rgba(247,201,72,0.35); }
  .podium-2{ background: linear-gradient(180deg, rgba(207,211,230,0.16), rgba(207,211,230,0.02)); border:1px solid rgba(207,211,230,0.28); }
  .podium-3{ background: linear-gradient(180deg, rgba(201,138,75,0.18), rgba(201,138,75,0.02)); border:1px solid rgba(201,138,75,0.3); }

  .rank-row{
    display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius: var(--radius-md); margin-bottom:10px;
    transition: border-color .2s;
  }
  .rank-row.me{ border:1.5px solid rgba(139,92,246,.4); background: #f3edff; }
  .rank-num{ font-family:var(--font-head); font-weight:800; font-size:15px; color: var(--text-dim); width:26px; text-align:center; }
  .rank-info{ flex:1; min-width:0; }
  .rank-name{ font-weight:700; font-size:14.5px; }
  .rank-you{ font-size:10.5px; color: var(--violet-soft); font-weight:700; }
  .rank-pts{ font-family:var(--font-head); font-weight:800; font-size:14.5px; color:var(--cyan); }

  /* ---------- orders ---------- */
  .order-card{
    border-radius: var(--radius-md); padding:16px; margin-bottom:12px;
    display:flex; align-items:center; gap:14px;
  }
  .order-icon{
    width:46px; height:46px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:21px; flex:0 0 auto;
    background: linear-gradient(140deg, rgba(139,92,246,.25), rgba(56,208,248,.12));
  }
  .order-info{ flex:1; min-width:0; }
  .order-name{ font-weight:700; font-size:14.5px; margin-bottom:3px; }
  .order-meta{ font-size:11.5px; color: var(--text-faint); }
  .order-status{
    font-size:11px; font-weight:800; padding:6px 12px; border-radius:100px; white-space:nowrap; flex:0 0 auto;
    background: rgba(76,224,168,0.14); color: var(--success); border:1px solid rgba(76,224,168,0.3);
  }

  .empty-state{ text-align:center; padding:52px 20px; color: var(--text-dim); border-radius: var(--radius-lg); }
  .empty-icon{ font-size:42px; margin-bottom:14px; opacity:.8; }
  .empty-title{ font-weight:700; font-size:15.5px; color:var(--text); margin-bottom:6px; }
  .empty-sub{ font-size:13px; color: var(--text-faint); line-height:1.7; }

  /* ---------- rewards ---------- */
  .reward-card{
    border-radius: var(--radius-md); padding:20px; margin-bottom:14px; position:relative; overflow:hidden;
  }
  .reward-tag{ font-size:11px; font-weight:800; color: var(--violet-soft); margin-bottom:8px; display:block; }
  .reward-title{ font-family:var(--font-head); font-weight:800; font-size:16.5px; margin-bottom:6px; }
  .reward-desc{ font-size:13px; color:var(--text-dim); line-height:1.7; }
  .soon-pill{
    position:absolute; top:16px; left:16px; font-size:10.5px; font-weight:800; padding:5px 12px; border-radius:100px;
    background: rgba(255,255,255,0.06); color: var(--text-faint); border:1px solid var(--border);
  }

  /* ---------- rules ---------- */
  .rule-item{ display:flex; gap:14px; padding:15px 4px; border-bottom:1px solid var(--border-soft); }
  .rule-item:last-child{ border-bottom:none; }
  .rule-num{
    width:30px; height:30px; border-radius:10px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-head); font-weight:800; font-size:13px;
    background: rgba(139,92,246,0.14); color: var(--violet-soft);
  }
  .rule-text{ font-size:14px; line-height:1.8; padding-top:4px; }

  /* ---------- account ---------- */
  .profile-hero{ display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:24px; }
  .profile-avatar{
    width:88px; height:88px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-head); font-weight:900; font-size:34px; color:#0a0714;
    background: linear-gradient(140deg, var(--violet-soft), var(--cyan));
    box-shadow: 0 0 0 5px rgba(139,92,246,0.12), 0 10px 40px -12px var(--violet-glow);
    margin-bottom:14px;
  }
  .profile-name{ font-family:var(--font-head); font-weight:800; font-size:20px; }
  .profile-status{ font-size:12.5px; color: var(--success); margin-top:5px; display:flex; align-items:center; gap:6px; }
  .profile-status::before{ content:''; width:7px; height:7px; border-radius:50%; background: var(--success); box-shadow:0 0 6px var(--success); }

  .info-list{ border-radius: var(--radius-md); overflow:hidden; }
  .info-row{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border-soft); }
  .info-row:last-child{ border-bottom:none; }
  .info-key{ display:flex; align-items:center; gap:10px; color:var(--text-dim); font-size:13.5px; }
  .info-val{ font-weight:800; font-size:14px; }

  /* =====================================================
     BOTTOM NAV (mobile)
  ===================================================== */
  .bottomnav{
    position:fixed; bottom:14px; left:14px; right:14px; z-index:40;
    display:flex; justify-content:space-around; align-items:center;
    padding:9px 6px; border-radius:24px;
    background: #ffffff;
    box-shadow:0 20px 50px -18px rgba(20,8,70,.5);
  }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 10px; border-radius:14px;
    color: var(--text-faint); font-size:9.5px; font-weight:700; flex:1; transition: color .2s; position:relative;
  }
  .nav-item .ni-icon{ font-size:18px; transition: transform .25s; }
  .nav-item.active{ color: var(--violet-soft); }
  .nav-item.active .ni-icon{ transform: translateY(-2px); }
  .nav-item::after{
    content:''; position:absolute; bottom:1px; width:4px; height:4px; border-radius:50%;
    background: var(--violet-soft); box-shadow:0 0 8px var(--violet-soft);
    opacity:0; transform: scale(.4); transition: opacity .25s, transform .25s;
  }
  .nav-item.active::after{ opacity:1; transform: scale(1); }
  .nav-more{ display:flex; }

  /* ---------- more sheet (rules + rewards on mobile via bottom nav overflow) ---------- */
  .sheet-overlay{
    position:fixed; inset:0; z-index:60; background: rgba(4,4,10,0.6); backdrop-filter: blur(4px);
    display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition: opacity .25s;
  }
  .sheet-overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    width:100%; border-radius:24px 24px 0 0; padding:10px 16px 28px;
    background: rgba(14,14,24,0.98); border:1px solid var(--border);
    transform: translateY(30px); transition: transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .sheet-overlay.show .sheet{ transform: translateY(0); }
  .sheet-handle{ width:38px; height:4px; border-radius:10px; background: var(--border); margin:6px auto 16px; }
  .sheet-item{ display:flex; align-items:center; gap:14px; padding:15px 6px; font-size:14.5px; font-weight:600; border-radius:12px; }
  .sheet-item:hover{ background: rgba(255,255,255,0.04); }
  .sheet-item .si-icon{ font-size:19px; width:26px; text-align:center; }

  /* =====================================================
     MODAL / TOAST
  ===================================================== */
  .modal-overlay{
    position:fixed; inset:0; z-index:80; background: rgba(4,4,10,0.65); backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center; padding:24px;
    opacity:0; pointer-events:none; transition: opacity .25s;
  }
  .modal-overlay.show{ opacity:1; pointer-events:auto; }
  .modal-box{
    width:100%; max-width:360px; border-radius: var(--radius-lg); padding:28px 24px 24px; text-align:center;
    background: rgba(16,16,28,0.98); border:1px solid var(--border);
    transform: scale(.9) translateY(10px); transition: transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .modal-overlay.show .modal-box{ transform: scale(1) translateY(0); }
  .modal-icon{ font-size:38px; margin-bottom:14px; }
  .modal-title{ font-family:var(--font-head); font-weight:800; font-size:17px; margin-bottom:8px; }
  .modal-text{ font-size:13.5px; color: var(--text-dim); line-height:1.8; margin-bottom:8px; }
  .modal-product{ font-weight:800; color:var(--cyan); }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .modal-actions button{ flex:1; padding:13px; }

  .toast-wrap{ position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; gap:10px; align-items:center; width:100%; padding:0 20px; }
  .toast{
    display:flex; align-items:center; gap:10px; padding:14px 18px; border-radius:100px; font-size:13.5px; font-weight:700;
    background: rgba(16,16,28,0.96); border:1px solid var(--border); box-shadow:0 16px 40px -16px rgba(0,0,0,.7);
    transform: translateY(-30px); opacity:0; transition: all .35s cubic-bezier(.2,.8,.2,1);
    max-width:340px;
  }
  .toast.show{ transform: translateY(0); opacity:1; }
  .toast.success{ border-color: rgba(76,224,168,0.4); }
  .toast.error{ border-color: rgba(247,110,110,0.4); }

  /* ---------- back to top ---------- */
  #toTop{
    position:fixed; bottom:92px; left:20px; z-index:35; width:42px; height:42px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:16px;
    background: var(--glass-strong); border:1px solid var(--border);
    opacity:0; pointer-events:none; transform: translateY(10px); transition: all .3s;
  }
  #toTop.show{ opacity:1; pointer-events:auto; transform:translateY(0); }

  /* ---------- reveal on scroll ---------- */
  .reveal{ opacity:0; transform: translateY(14px); transition: opacity .55s ease, transform .55s ease; }
  .reveal.in{ opacity:1; transform:translateY(0); }
  .product-grid .reveal:nth-child(1),.stat-grid .reveal:nth-child(1){ transition-delay:.02s; }
  .product-grid .reveal:nth-child(2),.stat-grid .reveal:nth-child(2){ transition-delay:.08s; }
  .product-grid .reveal:nth-child(3),.stat-grid .reveal:nth-child(3){ transition-delay:.14s; }
  .product-grid .reveal:nth-child(4),.stat-grid .reveal:nth-child(4){ transition-delay:.2s; }
  .product-grid .reveal:nth-child(5){ transition-delay:.26s; }
  .product-grid .reveal:nth-child(6){ transition-delay:.32s; }

  /* ---------- desktop breakpoints ---------- */
  @media (min-width: 760px){
    .bottomnav{ display:none; }
    .desknav{ display:flex; }
    main{ padding-bottom:60px; }
    .product-grid{ grid-template-columns: repeat(3,1fr); }
    .stat-grid{ grid-template-columns: repeat(4,1fr); }
    #toTop{ bottom:30px; }
  }
  @media (max-width: 380px){
    .balance-value{ font-size:38px; }
    .brand-text .g-name{ max-width:36vw; }
  }
</style>
</head>

<script>
(function(){
  "use strict";

  /* ============ FIXED DATA — do not mutate ============ */
  const GROUP_NAME = "🇸🇦『𝓑𝓻𝓪𝓲𝓷𝓼𝓽𝓸𝓻𝓶』💬🈴🇯🇵";

  const LOGIN_MEMBERS = ["شيزوكو","محمد","عمرو","ناصر","FIB","محمود","يكتب"];

  const POINTS = Object.freeze({
    "محمد": 350,
    "يكتب": 200,
    "FIB": 170,
    "محمود": 0,
    "شيزوكو": 0,
    "عمرو": 0,
    "ناصر": 0
  });

  // Fixed leaderboard order — do not resort
  const LEADERBOARD = Object.freeze([
    { name:"محمد",    pts:350, medal:"🥇" },
    { name:"يكتب",    pts:200, medal:"🥈" },
    { name:"FIB",     pts:170, medal:"🥉" },
    { name:"محمود",   pts:0,   medal:"4️⃣" },
    { name:"شيزوكو",  pts:0,   medal:"5️⃣" },
    { name:"عمرو",    pts:0,   medal:"6️⃣" },
    { name:"ناصر",    pts:0,   medal:"7️⃣" }
  ]);

  const PRODUCTS = Object.freeze([
    { id:"rank",    icon:"👑", name:"رتبة خاصة",        desc:"رتبة مميزة تظهر بجانب اسمك في الجروب", price:500, cat:"مميز",  tag:"top" },
    { id:"pin",     icon:"📌", name:"تثبيت رسالة",       desc:"تثبيت رسالتك في أعلى الجروب لمدة محددة", price:350, cat:"تفاعل", tag:"hot" },
    { id:"name",    icon:"✏️", name:"تغيير الاسم",       desc:"طلب تغيير اسم العرض الخاص بك",           price:300, cat:"تخصيص" },
    { id:"ad",      icon:"📢", name:"إعلان خاص",         desc:"نشر إعلانك الخاص للجميع في الجروب",      price:450, cat:"تفاعل" },
    { id:"medal",   icon:"🏅", name:"وسام مميز",         desc:"وسام يوضع بجانب اسمك كعلامة تميز",       price:250, cat:"تخصيص" },
    { id:"color",   icon:"🎨", name:"لون الاسم",         desc:"لون مخصص لاسمك داخل الجروب",             price:400, cat:"تخصيص", tag:"new" },
    { id:"vip",     icon:"💎", name:"VIP",               desc:"عضوية VIP مع مزايا حصرية في الجروب",     price:700, cat:"مميز",  tag:"top" },
    { id:"box",     icon:"🎁", name:"صندوق الحظ",        desc:"مفاجأة عشوائية شكلية من إدارة الجروب",   price:600, cat:"مميز" },
    { id:"weekly",  icon:"⭐", name:"عضوية أسبوعية",     desc:"مزايا خاصة تستمر لمدة أسبوع كامل",       price:800, cat:"مميز",  tag:"top" },
    { id:"title",   icon:"🏷️", name:"لقب مميز",          desc:"لقب حصري يظهر أسفل اسمك",                price:280, cat:"تخصيص" },
    { id:"badge",   icon:"🔖", name:"شارة خاصة",         desc:"شارة تظهر في قائمة الأعضاء المميزين",    price:320, cat:"تخصيص", tag:"new" },
    { id:"priority",icon:"⚡", name:"أولوية في فعالية",   desc:"أولوية دخول أول فعالية قادمة",           price:380, cat:"تفاعل" },
    { id:"congrats",icon:"🎉", name:"إعلان تهنئة",       desc:"رسالة تهنئة خاصة باسمك من الإدارة",      price:260, cat:"تفاعل" },
    { id:"famous",  icon:"🌟", name:"دخول قائمة المميزين",desc:"إدراج اسمك في قائمة الأعضاء المميزين",  price:420, cat:"مميز" },
    { id:"event",   icon:"🎪", name:"طلب فعالية خاصة",   desc:"اقتراح فعالية جديدة للجروب باسمك",       price:360, cat:"تفاعل" },
    { id:"card",    icon:"🪪", name:"بطاقة عضو VIP",     desc:"بطاقة عضوية شكلية مميزة باسمك",          price:340, cat:"تخصيص" }
  ]);

  const CATEGORIES = ["الكل","مميز","تخصيص","تفاعل"];

  const RULES = Object.freeze([
    "النقاط المعروضة في الموقع ثابتة.",
    "الشراء لا يمنح صلاحيات حقيقية خارج الجروب.",
    "الإدارة مسؤولة عن تنفيذ عمليات الشراء المسجلة.",
    "المنتجات والأسعار الأساسية يحددها مسؤول المتجر.",
    "يمنع استخدام حساب شخص آخر.",
    "أي طلب مخالف يمكن رفضه."
  ]);

  const TAG_LABELS = { new:{t:"جديد", c:"badge-new"}, hot:{t:"الأكثر طلبًا", c:"badge-hot"}, top:{t:"مميز", c:"badge-top"} };

  /* ============ STATE ============ */
  let state = {
    user: null,
    section: "home",
    storeSearch: "",
    storeCat: "الكل",
    pendingProduct: null
  };

  const ORDERS_KEY = "brainstorm_store_orders_v1";

  function loadOrders(){
    try{
      const raw = localStorage.getItem(ORDERS_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveOrders(orders){
    try{ localStorage.setItem(ORDERS_KEY, JSON.stringify(orders)); }catch(e){ /* storage unavailable — ignore silently */ }
  }
  let orders = loadOrders();

  /* ============ HELPERS ============ */
  function rankOf(name){
    const i = LEADERBOARD.findIndex(m => m.name === name);
    return i === -1 ? "—" : (i+1);
  }
  function fmt(n){ return n.toLocaleString("ar-EG"); }
  function initial(name){ return name.trim().charAt(0); }
  function nowStr(){
    const d = new Date();
    return d.toLocaleString("ar-EG", { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit' });
  }

  function showToast(msg, type){
    const wrap = document.getElementById("toastWrap");
    const el = document.createElement("div");
    el.className = "toast " + (type || "");
    el.innerHTML = "<span>" + (type==="success" ? "✅" : type==="error" ? "⚠️" : "ℹ️") + "</span><span>" + msg + "</span>";
    wrap.appendChild(el);
    requestAnimationFrame(()=> el.classList.add("show"));
    setTimeout(()=>{
      el.classList.remove("show");
      setTimeout(()=> el.remove(), 350);
    }, 2600);
  }

  /* ============ LOGIN ============ */
  const loginError = document.getElementById("loginError");
  const memberSelect = document.getElementById("memberSelect");

  document.getElementById("loginBtn").addEventListener("click", function(){
    const val = memberSelect.value;
    if(!val || LOGIN_MEMBERS.indexOf(val) === -1){
      loginError.classList.add("show");
      memberSelect.style.borderColor = "rgba(247,110,110,0.6)";
      return;
    }
    loginError.classList.remove("show");
    state.user = val;
    enterApp();
  });

  memberSelect.addEventListener("change", function(){
    loginError.classList.remove("show");
    memberSelect.style.borderColor = "";
  });

  function enterApp(){
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").classList.add("active");
    document.getElementById("topAvatar").textContent = initial(state.user);
    document.getElementById("userGreetTop").textContent = state.user + " • المركز " + rankOf(state.user);
    buildDeskNav();
    navigate("home");
  }

  document.getElementById("logoutBtn").addEventListener("click", function(){
    state.user = null;
    document.getElementById("app").classList.remove("active");
    document.getElementById("loginScreen").style.display = "flex";
    memberSelect.value = "";
    showToast("تم تسجيل الخروج", "info");
  });

  /* ============ NAVIGATION ============ */
  const NAV_SECTIONS = [
    { id:"home", label:"الرئيسية", icon:"🏠" },
    { id:"leaderboard", label:"المتصدرين", icon:"🏆" },
    { id:"store", label:"المتجر", icon:"🛒" },
    { id:"rewards", label:"المكافآت", icon:"🎁" },
    { id:"orders", label:"مشترياتي", icon:"🛍️" },
    { id:"rules", label:"القوانين", icon:"📜" },
    { id:"account", label:"حسابي", icon:"👤" }
  ];

  function buildDeskNav(){
    const nav = document.getElementById("desknav");
    nav.innerHTML = "";
    NAV_SECTIONS.forEach(s => {
      const b = document.createElement("button");
      b.dataset.section = s.id;
      b.innerHTML = "<span>"+s.icon+"</span><span>"+s.label+"</span>";
      b.addEventListener("click", ()=> navigate(s.id));
      nav.appendChild(b);
    });
  }

  document.querySelectorAll(".bottomnav .nav-item[data-section]").forEach(btn=>{
    btn.addEventListener("click", ()=> navigate(btn.dataset.section));
  });

  function navigate(section){
    state.section = section;
    document.querySelectorAll(".nav-item[data-section]").forEach(b=>{
      b.classList.toggle("active", b.dataset.section === section);
    });
    document.querySelectorAll("#desknav button").forEach(b=>{
      b.classList.toggle("active", b.dataset.section === section);
    });
    closeSheet();
    render();
    document.getElementById("mainContent").scrollIntoView({behavior:"instant", block:"start"});
    window.scrollTo(0,0);
  }

  /* ---- more sheet ---- */
  const moreSheet = document.getElementById("moreSheet");
  document.getElementById("moreBtn").addEventListener("click", ()=> moreSheet.classList.add("show"));
  moreSheet.addEventListener("click", (e)=>{ if(e.target === moreSheet) closeSheet(); });
  moreSheet.querySelectorAll(".sheet-item").forEach(it=>{
    it.addEventListener("click", ()=> navigate(it.dataset.section));
  });
  function closeSheet(){ moreSheet.classList.remove("show"); }

  /* ---- notifications ---- */
  const notifBtn = document.getElementById("notifBtn");
  const notifPanel = document.getElementById("notifPanel");
  notifBtn.addEventListener("click", (e)=>{
    e.stopPropagation();
    renderNotifs();
    notifPanel.classList.toggle("show");
  });
  document.addEventListener("click", (e)=>{
    if(!notifPanel.contains(e.target) && e.target !== notifBtn){ notifPanel.classList.remove("show"); }
  });
  function renderNotifs(){
    const list = document.getElementById("notifList");
    const dot = document.getElementById("notifDot");
    if(orders.length === 0){
      list.innerHTML = '<div class="notif-empty">لا توجد إشعارات بعد</div>';
      dot.style.display = "none";
      return;
    }
    dot.style.display = "block";
    list.innerHTML = orders.slice().reverse().slice(0,5).map(o=>
      '<div class="notif-item">🛍️ اشتريت «'+o.name+'» — '+o.status+'</div>'
    ).join("");
  }

  /* ============ RENDER SECTIONS ============ */
  function render(){
    const main = document.getElementById("mainContent");
    let html = "";
    switch(state.section){
      case "home": html = renderHome(); break;
      case "leaderboard": html = renderLeaderboard(); break;
      case "store": html = renderStore(); break;
      case "rewards": html = renderRewards(); break;
      case "orders": html = renderOrders(); break;
      case "rules": html = renderRules(); break;
      case "account": html = renderAccount(); break;
    }
    main.innerHTML = '<div class="section">'+html+'</div>';
    attachSectionEvents();
    setupReveal();
    if(state.section === "home") animateBalance();
  }

  function animateBalance(){
    const el = document.getElementById("balanceNum");
    if(!el) return;
    const target = POINTS[state.user] || 0;
    if(target === 0){ el.textContent = fmt(0); return; }
    const duration = 700;
    const start = performance.now();
    function tick(now){
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(Math.round(eased * target));
      if(p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function renderHome(){
    const pts = POINTS[state.user] || 0;
    const suggested = PRODUCTS.slice(0,3);
    return `
      <div class="welcome">أهلاً بك يا ${state.user} 👋</div>
      <div class="balance-card reveal">
        <div class="balance-label">رصيدك الحالي</div>
        <div class="balance-value"><span id="balanceNum">0</span><span class="unit">نقطة</span></div>
        <div class="balance-rank">🏆 ترتيبك الحالي: المركز ${rankOf(state.user)} من ${LEADERBOARD.length}</div>
      </div>
      <div class="stat-grid">
        ${statCard("💎","نقاطي", fmt(pts))}
        ${statCard("🏆","مركزي", "#"+rankOf(state.user))}
        ${statCard("🎁","المكافآت", orders.length)}
        ${statCard("🛒","المنتجات", PRODUCTS.length)}
      </div>
      <div class="section-head"><h3>🔥 المنتجات المقترحة</h3></div>
      <div class="product-grid">${suggested.map(p=>productCard(p)).join("")}</div>
    `;
  }

  function statCard(icon,label,val){
    return `<div class="stat-card glass reveal"><div class="stat-icon">${icon}</div><div class="stat-num">${val}</div><div class="stat-lbl">${label}</div></div>`;
  }

  function productCard(p){
    const tag = p.tag ? TAG_LABELS[p.tag] : null;
    const balance = POINTS[state.user] || 0;
    const canAfford = balance >= p.price;
    return `
      <div class="product-card glass reveal ${canAfford ? "" : "locked"}">
        <div class="p-top-row">
          <div class="p-name">${p.name} ${p.icon}</div>
          <span class="price-badge">${fmt(p.price)} <span class="star">⭐</span></span>
        </div>
        <div class="p-desc">${p.desc}${tag ? ` <span class="p-badge ${tag.c}">${tag.t}</span>` : ""}</div>
        ${canAfford
          ? `<button class="redeem-btn" data-redeem="${p.id}">🛒 شراء</button>`
          : `<button class="redeem-btn locked-btn" data-locked="${p.id}">🔒 رصيد غير كافٍ</button>`
        }
      </div>`;
  }

  function renderLeaderboard(){
    const top3 = LEADERBOARD.slice(0,3);
    const rest = LEADERBOARD.slice(3);
    const order = [top3[1], top3[0], top3[2]]; // 2nd, 1st, 3rd visual order
    const podiumHTML = order.map((m, idx)=>{
      const rank = LEADERBOARD.indexOf(m)+1;
      const cls = rank===1 ? "podium-1 p1" : rank===2 ? "podium-2" : "podium-3";
      return `<div class="podium-slot ${cls} reveal">
                ${rank===1 ? '<div class="podium-crown">👑</div>' : ""}
                <div class="p-medal">${m.medal}</div>
                <div class="p-name">${m.name}</div>
                <div class="p-pts">${fmt(m.pts)}</div>
              </div>`;
    }).join("");

    const restHTML = rest.map((m)=>{
      const idx = LEADERBOARD.indexOf(m)+1;
      const isMe = m.name === state.user;
      return `<div class="rank-row glass ${isMe?'me':''}">
        <div class="rank-num">${m.medal}</div>
        <div class="rank-info">
          <div class="rank-name">${m.name}</div>
          ${isMe ? '<div class="rank-you">هذا أنت</div>' : ""}
        </div>
        <div class="rank-pts">${fmt(m.pts)} 💎</div>
      </div>`;
    }).join("");

    return `
      <div class="page-title">🏆 المتصدرين</div>
      <div class="page-sub">ترتيب أعضاء الجروب حسب النقاط</div>
      <div class="podium">${podiumHTML}</div>
      ${restHTML}
    `;
  }

  function renderStore(){
    const filtered = PRODUCTS.filter(p=>{
      const matchCat = state.storeCat === "الكل" || p.cat === state.storeCat;
      const matchSearch = p.name.toLowerCase().includes(state.storeSearch.toLowerCase()) || state.storeSearch === "";
      return matchCat && matchSearch;
    });
    return `
      <div class="page-title">🛒 المتجر</div>
      <div class="page-sub">استبدل نقاطك بمزايا داخل الجروب</div>
      <div class="search-bar glass">
        <span>🔎</span>
        <input type="text" id="storeSearchInput" placeholder="ابحث عن منتج..." value="${state.storeSearch}">
      </div>
      <div class="chip-row">
        ${CATEGORIES.map(c=>`<button class="chip ${c===state.storeCat?'active':''}" data-cat="${c}">${c}</button>`).join("")}
      </div>
      ${filtered.length ? `<div class="product-grid">${filtered.map(p=>productCard(p)).join("")}</div>` : emptyState("🔍","لا توجد نتائج","جرّب كلمة بحث أخرى أو اختر تصنيفًا مختلفًا")}
    `;
  }

  function emptyState(icon,title,sub){
    return `<div class="empty-state glass reveal">
      <div class="empty-icon">${icon}</div>
      <div class="empty-title">${title}</div>
      <div class="empty-sub">${sub}</div>
    </div>`;
  }

  function renderRewards(){
    return `
      <div class="page-title">🎁 المكافآت</div>
      <div class="page-sub">مفاجآت ومزايا خاصة بأعضاء الجروب</div>

      <div class="reward-card glass reveal">
        <span class="reward-tag">🔥 منتج اليوم</span>
        <div class="reward-title">💎 VIP بسعر مميز</div>
        <div class="reward-desc">أعلى منتج طلبًا هذا الأسبوع بين أعضاء الجروب.</div>
      </div>

      <div class="reward-card glass reveal">
        <span class="reward-tag">⭐ عضو الأسبوع</span>
        <div class="reward-title">${LEADERBOARD[0].name}</div>
        <div class="reward-desc">صاحب أعلى رصيد نقاط هذا الأسبوع في الجروب.</div>
      </div>

      <div class="reward-card glass reveal">
        <span class="reward-tag">🏆 Hall of Fame</span>
        <div class="reward-title">قائمة الأساطير</div>
        <div class="reward-desc">${LEADERBOARD.slice(0,3).map(m=>m.medal+" "+m.name).join(" · ")}</div>
      </div>

      <div class="reward-card glass reveal">
        <span class="soon-pill">قريبًا</span>
        <span class="reward-tag">🎟️ كوبونات</span>
        <div class="reward-title">كوبونات خصم على المنتجات</div>
        <div class="reward-desc">نظام كوبونات مخصصة قادم قريبًا للأعضاء النشطين.</div>
      </div>

      <div class="reward-card glass reveal">
        <span class="soon-pill">قريبًا</span>
        <span class="reward-tag">🎁 مكافآت خاصة</span>
        <div class="reward-title">مفاجآت أسبوعية للأعضاء</div>
        <div class="reward-desc">مكافآت إضافية تُعلن من إدارة الجروب أسبوعيًا.</div>
      </div>
    `;
  }

  function renderOrders(){
    const mine = orders.filter(o=> o.user === state.user).slice().reverse();
    if(mine.length === 0){
      return `<div class="page-title">🛍️ مشترياتي</div><div class="page-sub">سجل مشترياتك من المتجر</div>`
        + emptyState("🧾","لا توجد مشتريات بعد","عند شراء منتج من المتجر سيظهر هنا");
    }
    return `
      <div class="page-title">🛍️ مشترياتي</div>
      <div class="page-sub">سجل مشترياتك من المتجر</div>
      ${mine.map(o=>`
        <div class="order-card glass reveal">
          <div class="order-icon">${o.icon}</div>
          <div class="order-info">
            <div class="order-name">${o.name}</div>
            <div class="order-meta">${fmt(o.price)} نقطة • ${o.time}</div>
          </div>
          <div class="order-status">${o.status}</div>
        </div>
      `).join("")}
    `;
  }

  function renderRules(){
    return `
      <div class="page-title">📜 القوانين</div>
      <div class="page-sub">يرجى الالتزام بالقوانين التالية عند استخدام المتجر</div>
      <div class="info-list glass">
        ${RULES.map((r,i)=>`<div class="rule-item"><div class="rule-num">${i+1}</div><div class="rule-text">${r}</div></div>`).join("")}
      </div>
    `;
  }

  function renderAccount(){
    const pts = POINTS[state.user] || 0;
    const mine = orders.filter(o=>o.user===state.user);
    return `
      <div class="page-title">👤 حسابي</div>
      <div class="page-sub">معلومات عضويتك في الجروب</div>
      <div class="profile-hero">
        <div class="profile-avatar">${initial(state.user)}</div>
        <div class="profile-name">${state.user}</div>
        <div class="profile-status">عضو نشط</div>
      </div>
      <div class="info-list glass">
        <div class="info-row"><div class="info-key">👤 الاسم</div><div class="info-val">${state.user}</div></div>
        <div class="info-row"><div class="info-key">💎 النقاط</div><div class="info-val">${fmt(pts)}</div></div>
        <div class="info-row"><div class="info-key">🏆 المركز</div><div class="info-val">#${rankOf(state.user)}</div></div>
        <div class="info-row"><div class="info-key">✅ حالة العضوية</div><div class="info-val">نشط</div></div>
        <div class="info-row"><div class="info-key">🛍️ عدد المشتريات</div><div class="info-val">${mine.length}</div></div>
      </div>
    `;
  }

  /* ============ SECTION EVENTS (delegated per-render) ============ */
  function attachSectionEvents(){
    document.querySelectorAll("[data-redeem]").forEach(btn=>{
      btn.addEventListener("click", ()=> openRedeemModal(btn.dataset.redeem));
    });
    document.querySelectorAll("[data-locked]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const p = PRODUCTS.find(x=>x.id===btn.dataset.locked);
        const balance = POINTS[state.user] || 0;
        showToast(`رصيدك ${fmt(balance)} 💎 غير كافٍ لشراء ${p ? p.name : "هذا المنتج"} (${fmt(p ? p.price : 0)} 💎)`, "error");
      });
    });

    const searchInput = document.getElementById("storeSearchInput");
    if(searchInput){
      searchInput.addEventListener("input", (e)=>{
        state.storeSearch = e.target.value;
        const activeEl = document.activeElement;
        render();
        const again = document.getElementById("storeSearchInput");
        if(again){ again.focus(); again.selectionStart = again.selectionEnd = again.value.length; }
      });
    }
    document.querySelectorAll(".chip[data-cat]").forEach(chip=>{
      chip.addEventListener("click", ()=>{
        state.storeCat = chip.dataset.cat;
        render();
      });
    });
  }

  /* ============ REDEEM FLOW ============ */
  const modalOverlay = document.getElementById("modalOverlay");
  function openRedeemModal(productId){
    const p = PRODUCTS.find(x=>x.id===productId);
    if(!p) return;
    const balance = POINTS[state.user] || 0;
    if(balance < p.price){
      showToast(`رصيدك ${fmt(balance)} 💎 غير كافٍ لشراء ${p.name} (${fmt(p.price)} 💎)`, "error");
      return;
    }
    state.pendingProduct = p;
    document.getElementById("modalProductName").textContent = p.icon + " " + p.name;
    document.getElementById("modalProductPrice").textContent = fmt(p.price);
    modalOverlay.classList.add("show");
  }
  document.getElementById("modalCancel").addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", (e)=>{ if(e.target === modalOverlay) closeModal(); });
  function closeModal(){ modalOverlay.classList.remove("show"); state.pendingProduct = null; }

  document.getElementById("modalConfirm").addEventListener("click", ()=>{
    const p = state.pendingProduct;
    if(!p) return;
    const order = {
      id: "ord_" + Date.now(),
      user: state.user,
      name: p.name,
      icon: p.icon,
      price: p.price,
      status: "تم الشراء ✅",
      time: nowStr()
    };
    orders.push(order);
    saveOrders(orders);
    closeModal();
    showToast("تم الشراء بنجاح 🛍️", "success");
    if(state.section === "orders" || state.section === "home") render();
  });

  /* ============ SCROLL: back-to-top + reveal ============ */
  const toTopBtn = document.getElementById("toTop");
  window.addEventListener("scroll", ()=>{
    toTopBtn.classList.toggle("show", window.scrollY > 320);
  });
  toTopBtn.addEventListener("click", ()=> window.scrollTo({top:0, behavior:"smooth"}));

  let revealObserver;
  function setupReveal(){
    if(revealObserver) revealObserver.disconnect();
    revealObserver = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          entry.target.classList.add("in");
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });
    document.querySelectorAll(".reveal").forEach(el=> revealObserver.observe(el));
  }

})();
</script>
</body>
</html>
