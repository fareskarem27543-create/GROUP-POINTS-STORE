<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🇸🇦『𝓑𝓻𝓪𝓲𝓷𝓼𝓽𝓸𝓻𝓶』💬🈴 🇯🇵</title><style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:#20264d;
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 10%,#dff5ff 0%,transparent 35%),
    radial-gradient(circle at 90% 20%,#e9ddff 0%,transparent 35%),
    linear-gradient(135deg,#f7fbff,#eef2ff,#ffffff);
}

/* الصفحة */
.container{
  width:94%;
  max-width:850px;
  margin:auto;
  padding:20px 0 45px;
}

/* الهيدر */
header{
  text-align:center;
  padding:30px 15px;
  margin-bottom:20px;
  border-radius:28px;

  background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.9);

  box-shadow:
    0 15px 40px rgba(72,91,160,.15);

  backdrop-filter:blur(15px);
}

header h1{
  margin:0;
  font-size:27px;
  color:#303b91;
  text-shadow:0 3px 15px rgba(70,80,180,.15);
}

.sponsor{
  margin-top:12px;
  font-size:17px;
  color:#6d5bc7;
}

/* الكروت */
.card{
  background:rgba(255,255,255,.75);

  border:1px solid rgba(255,255,255,.95);

  border-radius:24px;
  padding:20px;
  margin-bottom:18px;

  box-shadow:
    0 12px 35px rgba(74,91,160,.12);

  backdrop-filter:blur(15px);
}

/* تسجيل الدخول */
.login{
  text-align:center;
}

.loginTitle{
  font-size:25px;
  margin-bottom:8px;
  color:#303b91;
}

input{
  width:100%;
  padding:15px;
  margin:10px 0;

  border:2px solid #e3e7ff;
  outline:none;
  border-radius:15px;

  background:#ffffff;
  color:#20264d;

  font-size:16px;
  text-align:center;

  transition:.2s;
}

input:focus{
  border-color:#7185ff;
  box-shadow:0 0 0 4px rgba(113,133,255,.12);
}

input::placeholder{
  color:#9aa1bb;
}

/* الأزرار */
button{
  border:none;
  border-radius:14px;

  padding:12px 17px;
  margin:5px;

  font-size:15px;
  font-weight:bold;

  cursor:pointer;

  transition:.2s;
}

button:hover{
  transform:translateY(-2px);
}

.mainBtn{
  width:100%;
  color:white;

  background:
    linear-gradient(90deg,#637cff,#8d65e8);

  box-shadow:
    0 8px 20px rgba(103,112,235,.22);
}

.blue{
  background:#6481ff;
  color:white;
}

.orange{
  background:#ffad5c;
  color:white;
}

.red{
  background:#ff6d86;
  color:white;
}

/* إخفاء */
.hidden{
  display:none;
}

/* بيانات اللاعب */
.userBox{
  text-align:center;
}

.userName{
  font-size:28px;
  font-weight:bold;
  color:#303b91;
}

.points{
  font-size:40px;
  color:#725be6;
  font-weight:bold;
  margin:12px 0;
}

.rank{
  font-size:19px;
  color:#707894;
}

/* التبويبات */
.tabs{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.tabs button{
  flex:1;
  padding:14px;
}

/* التبويب */
.tab{
  display:none;
}

.tab.active{
  display:block;
}

/* اللاعب */
.player{
  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
    linear-gradient(135deg,#f8faff,#f1f4ff);

  border:1px solid #e3e8ff;

  border-radius:18px;
  padding:15px;
  margin:10px 0;

  box-shadow:
    0 6px 18px rgba(78,94,170,.08);
}

.playerName{
  font-size:20px;
  font-weight:bold;
  color:#30375f;
}

.playerPoints{
  color:#735de0;
  margin-top:6px;
  font-weight:bold;
}

.medal{
  font-size:24px;
  margin-left:7px;
}

/* المتجر */
.shopItem{
  background:
    linear-gradient(135deg,#ffffff,#f5f7ff);

  border:1px solid #e3e8ff;

  border-radius:20px;
  padding:17px;
  margin:12px 0;

  box-shadow:
    0 7px 20px rgba(78,94,170,.08);
}

.shopItem h3{
  margin:0 0 8px;
  color:#353d76;
}

.shopItem p{
  color:#707894;
  line-height:1.7;
}

.price{
  color:#735de0;
  font-size:20px;
  font-weight:bold;
  margin:10px 0;
}

/* النص الصغير */
.small{
  color:#8990aa;
  font-size:14px;
}

/* النوافذ */
.modal{
  position:fixed;
  inset:0;

  background:rgba(49,57,100,.35);

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;
  z-index:1000;

  backdrop-filter:blur(7px);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:100%;
  max-width:420px;

  background:#ffffff;

  border:1px solid #e6eaff;

  border-radius:25px;

  padding:25px;

  text-align:center;

  box-shadow:
    0 20px 60px rgba(49,61,130,.22);
}

.modalBox h2{
  color:#303b91;
}

.message{
  font-size:18px;
  line-height:1.8;
  color:#454d70;
}

/* العناوين */
h2{
  color:#303b91;
}

@media(max-width:600px){

  .container{
    width:95%;
    padding-top:12px;
  }

  header{
    padding:25px 10px;
  }

  header h1{
    font-size:23px;
  }

  .tabs{
    flex-direction:column;
  }

  .player{
    text-align:center;
    flex-direction:column;
    gap:8px;
  }

  .userName{
    font-size:25px;
  }

  .points{
    font-size:36px;
  }
}
</style></head><body><div class="container"><header>
  <h1>🇸🇦『𝓑𝓻𝓪𝓲𝓷𝓼𝓽𝓸𝓻𝓶』💬🈴 🇯🇵</h1>  <div class="sponsor">
    برعاية <b>Sukuna</b> 👑
  </div>
</header><!-- تسجيل الدخول --><div id="loginScreen" class="card login">  <div class="loginTitle">
    👋 تسجيل الدخول
  </div>  <p class="small">
    اكتب اسمك لمعرفة نقاطك ومركزك
  </p><input
id="loginName"
type="text"
placeholder="اكتب اسمك هنا"
autocomplete="off"

«»

  <button class="mainBtn" onclick="login()">
    🚀 دخول
  </button>  <p id="loginError" style="color:#ff5d78;"></p></div><!-- الموقع --><div id="site" class="hidden">  <!-- بيانات اللاعب -->  <div class="card userBox"><div id="welcomeName" class="userName"></div>

<div id="welcomeRank" class="rank"></div>

<div id="welcomePoints" class="points"></div>

<button class="red" onclick="logout()">
  🚪 خروج
</button>

  </div>  <!-- الأزرار -->  <div class="tabs"><button
  class="blue"
  onclick="openTab('leaderboard')">
  🏆 القائمة
</button>

<button
  class="orange"
  onclick="openTab('shop')">
  🛒 المتجر
</button>

  </div>  <!-- القائمة -->  <div id="leaderboard" class="tab active"><div class="card">

  <h2>🏆 قائمة اللاعبين</h2>

  <div id="playersList"></div>

</div>

  </div>  <!-- المتجر -->  <div id="shop" class="tab"><div class="card">

  <h2>🛒 متجر الجروب</h2>

  <p class="small">
    استخدم نقاطك لشراء الجوائز.
  </p>

  <div id="shopList"></div>

</div>

  </div></div></div><!-- نافذة تأكيد الشراء --><div id="buyModal" class="modal">  <div class="modalBox"><h2>🛒 تأكيد الشراء</h2>

<p id="buyText"></p>

<button class="blue" onclick="confirmBuy()">
  ✅ شراء
</button>

<button class="red" onclick="closeBuyModal()">
  ❌ إلغاء
</button>

  </div></div><!-- نافذة الرسائل --><div id="messageModal" class="modal">  <div class="modalBox"><div id="messageText" class="message"></div>

<button class="blue" onclick="closeMessage()">
  تمام 👍
</button>

  </div></div><script>

let players = [

  {name:"FIB",points:70},

  {name:"يكتب",points:50},

  {name:"محمد",points:0},

  {name:"محمود",points:0},

  {name:"عمرو",points:0},

  {name:"ناصر",points:0}

];


let currentPlayerIndex = null;

let pendingBuyIndex = null;


const shopItems = [

  {
    name:"💡 تلميح في فعالية",
    price:30,
    desc:"الحصول على تلميح واحد في فعالية."
  },

  {
    name:"🔄 تغيير سؤال",
    price:50,
    desc:"تغيير سؤال واحد في الفعالية."
  },

  {
    name:"🎯 اختيار الموضوع",
    price:70,
    desc:"تختار موضوع الفعالية القادمة."
  },

  {
    name:"🔁 محاولة إضافية",
    price:80,
    desc:"فرصة إضافية في فعالية."
  },

  {
    name:"🛡️ حصانة",
    price:100,
    desc:"لا تخسر نقاطك في فعالية واحدة."
  },

  {
    name:"👑 لقب خاص",
    price:150,
    desc:"تحصل على لقب مميز داخل الجروب."
  },

  {
    name:"⚡ مضاعفة النقاط",
    price:200,
    desc:"مضاعفة نقاطك في فعالية واحدة."
  },

  {
    name:"🎲 صندوق الحظ",
    price:100,
    desc:"جائزة عشوائية من إدارة الجروب."
  },

  {
    name:"🔥 فرصة ذهبية",
    price:250,
    desc:"ميزة قوية في فعالية تختارها الإدارة."
  },

  {
    name:"🏆 دخول بطولة خاصة",
    price:300,
    desc:"الدخول في بطولة خاصة للجروب."
  },

  {
    name:"🎁 جائزة مفاجأة",
    price:350,
    desc:"جائزة سرية يحددها المسؤول."
  },

  {
    name:"💎 VIP لمدة أسبوع",
    price:500,
    desc:"ميزة VIP لمدة أسبوع."
  },

  {
    name:"👑 ملك الجروب",
    price:700,
    desc:"لقب خاص لمدة أسبوع."
  },

  {
    name:"🌟 نجم الأسبوع",
    price:400,
    desc:"لقب نجم الأسبوع."
  },

  {
    name:"🚫 منع خصم",
    price:180,
    desc:"تحمي نقاطك من خصم واحد."
  },

  {
    name:"💰 استرداد نقاط",
    price:220,
    desc:"استرداد جزء من نقاط عملية شراء سابقة."
  }

];


function login(){

  const name =
    document.getElementById("loginName")
    .value.trim();

  const error =
    document.getElementById("loginError");


  if(!name){

    error.textContent =
      "⚠️ اكتب اسمك أولاً";

    return;
  }


  const index =
    players.findIndex(
      p =>
      p.name.toLowerCase()
      ===
      name.toLowerCase()
    );


  if(index === -1){

    error.textContent =
      "❌ الاسم غير موجود حالياً.";

    return;
  }


  currentPlayerIndex = index;

  error.textContent = "";


  document
    .getElementById("loginScreen")
    .classList.add("hidden");


  document
    .getElementById("site")
    .classList.remove("hidden");


  updateUser();

  showPlayers();

  showShop();

}


function logout(){

  currentPlayerIndex = null;


  document
    .getElementById("site")
    .classList.add("hidden");


  document
    .getElementById("loginScreen")
    .classList.remove("hidden");


  document
    .getElementById("loginName")
    .value = "";

}


function updateUser(){

  if(currentPlayerIndex === null)
    return;


  const player =
    players[currentPlayerIndex];


  const sorted =
    [...players]
    .sort(
      (a,b) =>
      b.points - a.points
    );


  const rank =
    sorted.findIndex(
      p =>
      p.name === player.name
    ) + 1;


  let medal = "";

  if(rank === 1)
    medal = "🥇";

  else if(rank === 2)
    medal = "🥈";

  else if(rank === 3)
    medal = "🥉";


  document
    .getElementById("welcomeName")
    .textContent =
    "👤 " + player.name;


  document
    .getElementById("welcomeRank")
    .textContent =
    medal + " المركز " + rank;


  document
    .getElementById("welcomePoints")
    .textContent =
    player.points + " نقطة";

}


function showPlayers(){

  const box =
    document.getElementById("playersList");


  const sorted =
    [...players]
    .sort(
      (a,b) =>
      b.points - a.points
    );


  box.innerHTML = "";


  sorted.forEach(
    (player,index) => {

      let medal = "";

      if(index === 0)
        medal = "🥇";

      else if(index === 1)
        medal = "🥈";

      else if(index === 2)
        medal = "🥉";

      else
        medal = "👤";


      box.innerHTML += `

        <div class="player">

          <div>

            <div class="playerName">

              <span class="medal">
                ${medal}
              </span>

              ${escapeHTML(player.name)}

            </div>

            <div class="playerPoints">
              💰 ${player.points} نقطة
            </div>

          </div>

        </div>

      `;

    }
  );

}


function showShop(){

  const box =
    document.getElementById("shopList");


  box.innerHTML = "";


  shopItems.forEach(
    (item,index) => {

      box.innerHTML += `

        <div class="shopItem">

          <h3>
            ${item.name}
          </h3>

          <p>
            ${item.desc}
          </p>

          <div class="price">
            💰 ${item.price} نقطة
          </div>

          <button
            class="mainBtn"
            onclick="buyItem(${index})">

            🛒 شراء

          </button>

        </div>

      `;

    }
  );

}


function buyItem(index){

  if(currentPlayerIndex === null){

    showMessage(
      "⚠️ سجل الدخول أولاً."
    );

    return;
  }


  const player =
    players[currentPlayerIndex];


  const item =
    shopItems[index];


  if(player.points < item.price){

    showMessage(

      "❌ نقاطك غير كافية." +

      "<br><br>نقاطك: " +

      player.points +

      "<br>السعر: " +

      item.price

    );

    return;
  }


  pendingBuyIndex = index;


  document
    .getElementById("buyText")
    .innerHTML =

    "هل تريد شراء:<br><br>" +

    "<b>" +

    item.name +

    "</b><br><br>" +

    "السعر: 💰 " +

    item.price +

    " نقطة";


  document
    .getElementById("buyModal")
    .classList.add("show");

}


function confirmBuy(){

  if(currentPlayerIndex === null){

    closeBuyModal();

    return;
  }


  if(pendingBuyIndex === null){

    closeBuyModal();

    return;
  }


  const item =
    shopItems[pendingBuyIndex];


  const player =
    players[currentPlayerIndex];


  if(player.points < item.price){

    closeBuyModal();

    showMessage(
      "❌ نقاطك غير كافية."
    );

    return;
  }


  player.points -= item.price;


  closeBuyModal();


  showPlayers();

  updateUser();


  showMessage(

    "🎉 تم الشراء بنجاح!" +

    "<br><br>" +

    item.name +

    "<br><br>" +

    "رصيدك الآن: " +

    player.points +

    " نقطة"

  );


  pendingBuyIndex = null;

}


function closeBuyModal(){

  document
    .getElementById("buyModal")
    .classList.remove("show");

}


function showMessage(text){

  document
    .getElementById("messageText")
    .innerHTML = text;


  document
    .getElementById("messageModal")
    .classList.add("show");

}


function closeMessage(){

  document
    .getElementById("messageModal")
    .classList.remove("show");

}


function openTab(tabName){

  document
    .querySelectorAll(".tab")
    .forEach(
      tab =>
      tab.classList.remove("active")
    );


  document
    .getElementById(tabName)
    .classList.add("active");

}


function escapeHTML(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


document
  .getElementById("loginName")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter")
        login();

    }
  );

</script></body>
</html>
